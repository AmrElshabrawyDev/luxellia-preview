<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <rect width="500" height="500" fill="#ffffff"/>
  <circle cx="250" cy="240" r="150" fill="#f7f5f0" fill-opacity="0.7"/>
  <!-- Cylindrical Flacon Silhouette -->
  <rect x="185" y="170" width="130" height="200" rx="24" fill="#ffffff" stroke="#17324d" stroke-width="1.8"/>
  <rect x="200" y="185" width="100" height="170" rx="16" fill="#f8fafb" stroke="#d9dee3" stroke-width="1"/>
  <!-- Label -->
  <rect x="210" y="225" width="80" height="85" rx="3" fill="#ffffff" stroke="#a8b1ba" stroke-width="1"/>
  <text x="250" y="255" font-family="serif" font-size="10" font-weight="bold" fill="#17324d" text-anchor="middle" letter-spacing="1.5">ROYAL</text>
  <text x="250" y="272" font-family="sans-serif" font-size="7.5" fill="#2f5f8a" text-anchor="middle">SOVEREIGN</text>
  <line x1="225" y1="282" x2="275" y2="282" stroke="#d9dee3" stroke-width="1"/>
  <text x="250" y="295" font-family="sans-serif" font-size="6.5" fill="#a8b1ba" text-anchor="middle">100 ML</text>
  <!-- Cap & Collar -->
  <rect x="235" y="152" width="30" height="18" fill="#d9dee3" stroke="#a8b1ba" stroke-width="1"/>
  <rect x="220" y="125" width="60" height="28" rx="6" fill="#17324d" stroke="#10283e" stroke-width="1.5"/>
  <!-- Shadow -->
  <ellipse cx="250" cy="388" rx="80" ry="11" fill="#17324d" fill-opacity="0.07"/>
</svg>
