<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f5f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f5"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#d9dee3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f7f5f0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="700" fill="url(#heroGrad)"/>
  <circle cx="1150" cy="350" r="320" fill="url(#glow)"/>
  
  <!-- Architectural background lines -->
  <line x1="1150" y1="50" x2="1150" y2="650" stroke="#a8b1ba" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="6 6"/>
  <circle cx="1150" cy="350" r="260" stroke="#17324d" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="1150" cy="350" r="180" stroke="#a8b1ba" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Pedestal -->
  <ellipse cx="1150" cy="530" rx="160" ry="35" fill="#17324d" fill-opacity="0.06"/>
  <rect x="1030" y="510" width="240" height="30" rx="4" fill="#ffffff" stroke="#d9dee3" stroke-width="1.5"/>
  
  <!-- Luxury Perfume Bottle Silhouette (Neutral Mock) -->
  <rect x="1090" y="260" width="120" height="240" rx="12" fill="#ffffff" stroke="#17324d" stroke-width="2"/>
  <rect x="1110" y="285" width="80" height="120" rx="4" fill="#f7f5f0" stroke="#a8b1ba" stroke-width="1"/>
  <text x="1150" y="335" font-family="'Cinzel', 'Amiri', serif" font-size="11" font-weight="bold" fill="#17324d" text-anchor="middle" letter-spacing="2">LUXELLIA</text>
  <text x="1150" y="355" font-family="'Montserrat', sans-serif" font-size="8" fill="#a8b1ba" text-anchor="middle" letter-spacing="1">MOCK EDITION</text>
  <!-- Cap & Neck -->
  <rect x="1125" y="230" width="50" height="30" fill="#e4e7ea" stroke="#17324d" stroke-width="1.5"/>
  <rect x="1115" y="180" width="70" height="50" rx="6" fill="#17324d" stroke="#10283e" stroke-width="1.5"/>
  <line x1="1115" y1="205" x2="1185" y2="205" stroke="#a8b1ba" stroke-width="1"/>
</svg>