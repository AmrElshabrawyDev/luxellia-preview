<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
    <rect width="500" height="500" fill="#ffffff"/>
    <circle cx="250" cy="240" r="150" fill="#f7f5f0" fill-opacity="0.6"/>
    <!-- Minimalist bottle outline -->
    <rect x="190" y="180" width="120" height="190" rx="16" fill="#ffffff" stroke="#17324d" stroke-width="1.8"/>
    <rect x="210" y="215" width="80" height="95" rx="4" fill="#f7f5f0" stroke="#d9dee3" stroke-width="1"/>
    <text x="250" y="255" font-family="'Cinzel', serif" font-size="10" font-weight="bold" fill="#17324d" text-anchor="middle" letter-spacing="1">MOCK</text>
    <text x="250" y="275" font-family="'Montserrat', sans-serif" font-size="8" fill="#66717c" text-anchor="middle">LUXELLIA</text>
    <!-- Cap -->
    <rect x="220" y="145" width="60" height="35" rx="5" fill="#17324d" stroke="#10283e" stroke-width="1.5"/>
    <!-- Shadow -->
    <ellipse cx="250" cy="385" rx="75" ry="10" fill="#17324d" fill-opacity="0.06"/>
  </svg>