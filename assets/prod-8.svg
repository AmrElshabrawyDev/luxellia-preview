<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <rect width="500" height="500" fill="#ffffff"/>
  <circle cx="250" cy="245" r="145" fill="#f7f5f0" fill-opacity="0.8"/>
  <!-- Geometric Faceted Bottle -->
  <polygon points="200,190 300,190 325,360 175,360" fill="#ffffff" stroke="#17324d" stroke-width="1.8"/>
  <polygon points="212,205 288,205 308,345 192,345" fill="#f8fafb" stroke="#d9dee3" stroke-width="1"/>
  <!-- Label with metallic border -->
  <rect x="215" y="240" width="70" height="70" rx="35" fill="#ffffff" stroke="#a8b1ba" stroke-width="1"/>
  <text x="250" y="270" font-family="serif" font-size="9" font-weight="bold" fill="#17324d" text-anchor="middle">ROSE</text>
  <text x="250" y="284" font-family="sans-serif" font-size="7" fill="#2f5f8a" text-anchor="middle">VELOURS</text>
  <!-- Crown Cap -->
  <rect x="240" y="170" width="20" height="20" fill="#d9dee3" stroke="#a8b1ba" stroke-width="1"/>
  <circle cx="250" cy="150" r="22" fill="#17324d" stroke="#10283e" stroke-width="1.5"/>
  <!-- Shadow -->
  <ellipse cx="250" cy="385" rx="85" ry="12" fill="#17324d" fill-opacity="0.08"/>
</svg>
