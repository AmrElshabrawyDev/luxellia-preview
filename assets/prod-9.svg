<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <rect width="500" height="500" fill="#ffffff"/>
  <circle cx="250" cy="245" r="150" fill="#f7f5f0" fill-opacity="0.6"/>
  <!-- Square Crystal Decanter -->
  <rect x="175" y="195" width="150" height="175" rx="10" fill="#ffffff" stroke="#17324d" stroke-width="1.8"/>
  <rect x="190" y="210" width="120" height="145" rx="6" fill="#f8fafb" stroke="#d9dee3" stroke-width="1"/>
  <!-- Midnight Blue Label Block -->
  <rect x="205" y="235" width="90" height="75" rx="4" fill="#17324d"/>
  <text x="250" y="265" font-family="serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">NOIR</text>
  <text x="250" y="282" font-family="sans-serif" font-size="7.5" fill="#a8b1ba" text-anchor="middle">AMBRÉ</text>
  <text x="250" y="298" font-family="sans-serif" font-size="6" fill="#ffffff" fill-opacity="0.7" text-anchor="middle">EXTRAIT</text>
  <!-- Heavy Brushed Steel Cap -->
  <rect x="210" y="150" width="80" height="45" rx="4" fill="#d9dee3" stroke="#a8b1ba" stroke-width="1.5"/>
  <line x1="210" y1="172" x2="290" y2="172" stroke="#a8b1ba" stroke-width="1"/>
  <!-- Shadow -->
  <ellipse cx="250" cy="388" rx="90" ry="12" fill="#17324d" fill-opacity="0.08"/>
</svg>
