<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <rect width="500" height="500" fill="#ffffff"/>
  <circle cx="250" cy="245" r="150" fill="#f7f5f0" fill-opacity="0.8"/>
  <!-- Velvet Presentation Box Outline -->
  <rect x="145" y="195" width="210" height="170" rx="10" fill="#ffffff" stroke="#17324d" stroke-width="1.8"/>
  <rect x="155" y="205" width="190" height="150" rx="6" fill="#f8fafb" stroke="#d9dee3" stroke-width="1"/>
  <!-- 3 Vials inside box -->
  <!-- Vial 1 -->
  <rect x="180" y="225" width="30" height="105" rx="15" fill="#ffffff" stroke="#17324d" stroke-width="1.2"/>
  <rect x="186" y="210" width="18" height="16" rx="3" fill="#17324d"/>
  <!-- Vial 2 (Center) -->
  <rect x="235" y="220" width="30" height="110" rx="15" fill="#ffffff" stroke="#2f5f8a" stroke-width="1.4"/>
  <rect x="241" y="205" width="18" height="16" rx="3" fill="#2f5f8a"/>
  <!-- Vial 3 -->
  <rect x="290" y="225" width="30" height="105" rx="15" fill="#ffffff" stroke="#17324d" stroke-width="1.2"/>
  <rect x="296" y="210" width="18" height="16" rx="3" fill="#17324d"/>
  <!-- Bottom Box Plaque -->
  <rect x="195" y="325" width="110" height="22" rx="3" fill="#ffffff" stroke="#a8b1ba" stroke-width="1"/>
  <text x="250" y="340" font-family="serif" font-size="7.5" font-weight="bold" fill="#17324d" text-anchor="middle">NICHE COFFRET</text>
  <!-- Cap Ribbons / Badge -->
  <text x="250" y="180" font-family="sans-serif" font-size="7" font-weight="bold" fill="#a8b1ba" text-anchor="middle" letter-spacing="1">3 x 10 ML</text>
  <!-- Shadow -->
  <ellipse cx="250" cy="385" rx="110" ry="12" fill="#17324d" fill-opacity="0.07"/>
</svg>
